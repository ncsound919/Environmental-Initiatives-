<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cheetah head silhouette -->
  <defs>
    <linearGradient id="cheetahGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC72C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A2C8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main head circle -->
  <circle cx="100" cy="100" r="80" fill="url(#cheetahGradient)" opacity="0.2"/>
  
  <!-- Cheetah head -->
  <ellipse cx="100" cy="105" rx="45" ry="50" fill="url(#cheetahGradient)"/>
  
  <!-- Ears -->
  <ellipse cx="75" cy="75" rx="15" ry="20" fill="url(#cheetahGradient)"/>
  <ellipse cx="125" cy="75" rx="15" ry="20" fill="url(#cheetahGradient)"/>
  
  <!-- Inner ears -->
  <ellipse cx="75" cy="78" rx="8" ry="12" fill="#FFDAB9"/>
  <ellipse cx="125" cy="78" rx="8" ry="12" fill="#FFDAB9"/>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="100" rx="8" ry="12" fill="#4A4A4A"/>
  <ellipse cx="115" cy="100" rx="8" ry="12" fill="#4A4A4A"/>
  
  <!-- Eye highlights -->
  <circle cx="87" cy="97" r="3" fill="white"/>
  <circle cx="117" cy="97" r="3" fill="white"/>
  
  <!-- Nose -->
  <path d="M 100 110 L 95 115 L 100 118 L 105 115 Z" fill="#4A4A4A"/>
  
  <!-- Mouth -->
  <path d="M 100 118 Q 90 125 85 122" stroke="#4A4A4A" stroke-width="2" fill="none"/>
  <path d="M 100 118 Q 110 125 115 122" stroke="#4A4A4A" stroke-width="2" fill="none"/>
  
  <!-- Cheetah spots -->
  <circle cx="70" cy="95" r="3" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="130" cy="95" r="3" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="65" cy="110" r="2.5" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="135" cy="110" r="2.5" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="75" cy="120" r="2" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="125" cy="120" r="2" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="85" cy="130" r="2.5" fill="#4A4A4A" opacity="0.6"/>
  <circle cx="115" cy="130" r="2.5" fill="#4A4A4A" opacity="0.6"/>
  
  <!-- Speed lines for cheetah theme -->
  <line x1="30" y1="100" x2="50" y2="100" stroke="#FFC72C" stroke-width="3" opacity="0.7"/>
  <line x1="25" y1="90" x2="45" y2="90" stroke="#FFC72C" stroke-width="2" opacity="0.5"/>
  <line x1="28" y1="110" x2="48" y2="110" stroke="#FFC72C" stroke-width="2" opacity="0.5"/>
</svg>
