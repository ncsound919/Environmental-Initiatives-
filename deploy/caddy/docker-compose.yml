# Caddy reverse proxy for the ECOS stack.
#
#   docker compose up -d
#   http://localhost:8088        (HTTP entrypoint)
#   https://localhost:8443       (TLS via Caddy internal CA; curl -k in local)
#
# Upstreams default to services running on the host (Docker Desktop:
# host.docker.internal). If you run the ECOS apps in Docker on the ecos-network
# instead, set WEB_UPSTREAM=web:3000, API_UPSTREAM=api:8000 and
# GATEWAY_UPSTREAM=api-gateway:8000 in .env, and attach this service to that
# network.

name: ecos-caddy

services:
  caddy:
    image: caddy:2-alpine
    container_name: ecos-caddy
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost:8088}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-host.docker.internal:3000}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8000}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-host.docker.internal:8001}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
